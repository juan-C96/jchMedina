<ng-container *transloco="let t; read: 'nav'">
  <header class="sticky-nav">
    <div class="nav-content">
      <a href="#hero" class="logo" (click)="closeMenu()">JCH.</a>

      <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Toggle menu">
        @if (!isMenuOpen) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--accent-color)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--accent-color)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        }
      </button>

      <nav class="main-nav" [class.open]="isMenuOpen">
        <a href="#about" (click)="closeMenu()"><span class="number">01.</span> {{ t('about') }}</a>
        <a href="#projects" (click)="closeMenu()"
          ><span class="number">02.</span> {{ t('projects') }}</a
        >
        <a href="#contact" (click)="closeMenu()"
          ><span class="number">03.</span> {{ t('contact') }}</a
        >

        <div class="lang-switcher">
          <button
            (click)="switchLanguage('en')"
            [class.active]="translocoService.getActiveLang() === 'en'"
          >
            EN
          </button>
          <button
            (click)="switchLanguage('es')"
            [class.active]="translocoService.getActiveLang() === 'es'"
          >
            ES
          </button>
        </div>
      </nav>
    </div>
  </header>
</ng-container>

<main>
  <app-hero></app-hero>
  <div class="bg-alternate"><app-about></app-about></div>
  <app-projects></app-projects>
  <div class="bg-alternate"><app-contact></app-contact></div>
</main>
